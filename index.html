<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa del servicio del campo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    .exporting .no-export { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 text-slate-800">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <div class="bg-blue-800 text-white p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Programa del servicio del campo</h1>
        <p class="text-blue-200 text-xs md:text-sm mt-1">Gestión Dinámica de Puntos de Encuentro (Lunes a Domingo)</p>
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <button onclick="toggleCatalogos()" class="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition flex-1 md:flex-none flex items-center justify-center gap-2">
          ⚙️ Administrar Menús (Base de Datos)
        </button>
        <button onclick="exportarJPG()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex-1 md:flex-none flex items-center justify-center gap-2">
          📷 Descargar Tabla en JPG
        </button>
      </div>
    </div>

    <!-- Base de datos editable para los desplegables -->
    <div id="panelCatalogos" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-slate-700 text-base">🗄️ Base de Datos de Opciones para Menús</h3>
        <p class="text-xs text-slate-500">Agrega o modifica los elementos separando cada uno con una nueva línea</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Puntos Fijos -->
        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700 uppercase">📍 Lista de Puntos Fijos:</label>
          <textarea id="txtPuntos" rows="8" class="w-full border rounded-xl p-3 text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Punto 1&#10;Punto 2&#10;Punto 3..."></textarea>
        </div>

        <!-- Encargados -->
        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700 uppercase">👤 Lista de Encargados:</label>
          <textarea id="txtEncargados" rows="8" class="w-full border rounded-xl p-3 text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Juan Pérez&#10;María Gómez..."></textarea>
        </div>

        <!-- Actividades -->
        <div class="space-y-2">
          <label class="block text-xs font-bold text-slate-700 uppercase">📌 Lista de Actividades / Trabajos:</label>
          <textarea id="txtActividades" rows="8" class="w-full border rounded-xl p-3 text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Construcción&#10;Limpieza&#10;Pintura..."></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="guardarCatalogos()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow">
          💾 Guardar Base de Datos y Actualizar Menús
        </button>
      </div>
    </div>

    <!-- Formulario con Menús Desplegables, Fecha y Jornada -->
    <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
      <h2 id="tituloForm" class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Asignar Punto de Encuentro</h2>
      
      <form id="formPunto" onsubmit="guardarPunto(event)" class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-8 gap-3">
        <input type="hidden" id="editId" value="">

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Día</label>
          <select id="dia" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
            <option value="Domingo">Domingo</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Fecha</label>
          <input type="date" id="fecha" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Jornada</label>
          <select id="jornada" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="Mañana">Mañana</option>
            <option value="Tarde">Tarde</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Hora</label>
          <input type="time" id="hora" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Seleccionar Punto</label>
          <select id="lugar" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required></select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Seleccionar Encargado</label>
          <select id="encargado" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required></select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Seleccionar Trabajo</label>
          <select id="actividad" class="w-full border rounded-xl p-2.5 text-xs bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" required></select>
        </div>

        <div class="flex items-end gap-1">
          <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">
            + Asignar Punto
          </button>
          <button type="button" id="btnCancelarEdit" onclick="cancelarEdicion()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-3 rounded-xl text-xs transition">
            ✕
          </button>
        </div>
      </form>
    </div>

    <!-- Tabla Semanal Exportable (Lunes a Domingo) -->
    <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200 overflow-x-auto">
      <div id="tablaExportable" class="p-6 bg-white min-w-[1300px]">
        <div class="text-center mb-6 pb-4 border-b">
          <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 uppercase tracking-wide">Programa del servicio del campo</h2>
        </div>
        <div class="grid grid-cols-7 gap-3"></div>
      </div>
    </div>

  </div>

  <script>
    const diasSemana = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
    
    // Carga de la base de datos de los menús
    let puntosFijos = JSON.parse(localStorage.getItem('bd_puntos')) || Array.from({ length: 40 }, (_, i) => `Punto ${i + 1}`);
    let encargadosFijos = JSON.parse(localStorage.getItem('bd_encargados')) || ["Juan Pérez", "María Gómez", "Carlos Ruiz", "Ana López", "Pedro Hernández"];
    let actividadesFijas = JSON.parse(localStorage.getItem('bd_actividades')) || ["Construcción", "Limpieza", "Pintura", "Logística", "Mantenimiento", "Supervisión"];
    
    let programacion = JSON.parse(localStorage.getItem('agendaPuntos')) || [];

    function toggleCatalogos() {
      const p = document.getElementById('panelCatalogos');
      p.classList.toggle('hidden');
      if (!p.classList.contains('hidden')) {
        document.getElementById('txtPuntos').value = puntosFijos.join('\n');
        document.getElementById('txtEncargados').value = encargadosFijos.join('\n');
        document.getElementById('txtActividades').value = actividadesFijas.join('\n');
      }
    }

    function guardarCatalogos() {
      puntosFijos = document.getElementById('txtPuntos').value.split('\n').map(s => s.trim()).filter(Boolean);
      encargadosFijos = document.getElementById('txtEncargados').value.split('\n').map(s => s.trim()).filter(Boolean);
      actividadesFijas = document.getElementById('txtActividades').value.split('\n').map(s => s.trim()).filter(Boolean);

      localStorage.setItem('bd_puntos', JSON.stringify(puntosFijos));
      localStorage.setItem('bd_encargados', JSON.stringify(encargadosFijos));
      localStorage.setItem('bd_actividades', JSON.stringify(actividadesFijas));

      cargarDesplegables();
      toggleCatalogos();
    }

    function cargarDesplegables() {
      document.getElementById('lugar').innerHTML = puntosFijos.map(p => `<option value="${p}">${p}</option>`).join('');
      document.getElementById('encargado').innerHTML = encargadosFijos.map(e => `<option value="${e}">${e}</option>`).join('');
      document.getElementById('actividad').innerHTML = actividadesFijas.map(a => `<option value="${a}">${a}</option>`).join('');
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return '';
      const partes = fechaStr.split('-');
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }
      return fechaStr;
    }

    // Función para convertir formato 24h a 12h con am/pm
    function formatearHora12h(hora24) {
      if (!hora24) return '';
      const [h, m] = hora24.split(':');
      let horas = parseInt(h, 10);
      const minutos = m || '00';
      const sufijo = horas >= 12 ? 'pm' : 'am';

      horas = horas % 12;
      horas = horas ? horas : 12;
      const horasStr = horas < 10 ? '0' + horas : horas;

      return `${horasStr}:${minutos} ${sufijo}`;
    }

    function renderizarTabla() {
      const contenedor = document.querySelector('#tablaExportable .grid');
      contenedor.innerHTML = '';

      diasSemana.forEach(dia => {
        const col = document.createElement('div');
        col.className = 'border-2 border-slate-300 rounded-xl overflow-hidden bg-slate-50 flex flex-col justify-between shadow-sm';
        
        const puntosDelDia = programacion.filter(item => item.dia === dia);

        // Obtener la fecha asignada al día si existe
        const primerConFecha = puntosDelDia.find(item => item.fecha);
        const fechaEncabezado = primerConFecha ? formatearFecha(primerConFecha.fecha) : '';

        let tarjetasHTML = puntosDelDia.map((item, index) => {
          const esFondoOscuro = index % 2 !== 0;
          const bgTarjeta = esFondoOscuro ? 'bg-slate-200 border-slate-300' : 'bg-white border-slate-200';
          const bgCajaTrabajo = esFondoOscuro ? 'bg-blue-100/80 border-blue-200' : 'bg-blue-50 border-blue-100';

          return `
            <div class="${bgTarjeta} p-3 rounded-xl shadow border text-xs space-y-1.5 transition-colors">
              <!-- Punto de Encuentro destacado -->
              <div class="font-black text-blue-900 text-sm md:text-base leading-snug border-b border-slate-300/60 pb-1">
                📍 ${item.lugar}
              </div>

              <!-- Fila con Jornada y Hora -->
              <div class="flex flex-wrap justify-between items-center text-[11px] text-slate-700 gap-1 pt-0.5">
                <span class="font-bold px-1.5 py-0.5 rounded ${item.jornada === 'Mañana' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'}">
                  ${item.jornada || 'Mañana'}
                </span>
                <span class="font-bold text-slate-800">🕒 ${formatearHora12h(item.hora)}</span>
              </div>

              <!-- Encargado -->
              <div class="text-slate-700 font-medium text-xs pt-0.5">
                👤 <span class="font-semibold text-slate-800">${item.encargado}</span>
              </div>

              <!-- Trabajo / Actividad -->
              <div class="text-slate-900 font-semibold ${bgCajaTrabajo} border p-1.5 rounded-lg text-xs">
                📌 ${item.actividad}
              </div>

              <!-- Botones de Acción (no se exportan a JPG) -->
              <div class="flex gap-1 pt-1.5 no-export">
                <button onclick="prepararEdicion(${item.id})" class="flex-1 bg-white/80 hover:bg-blue-50 text-blue-600 font-bold py-1 rounded border border-slate-300 text-[10px]">✏️ Editar</button>
                <button onclick="eliminarPunto(${item.id})" class="flex-1 bg-white/80 hover:bg-red-50 text-red-600 font-bold py-1 rounded border border-slate-300 text-[10px]">🗑️ Borrar</button>
              </div>
            </div>
          `;
        }).join('');

        if (puntosDelDia.length === 0) {
          tarjetasHTML = `<div class="text-center text-slate-400 py-10 text-xs italic font-medium">Sin registros</div>`;
        }

        col.innerHTML = `
          <div>
            <div class="bg-blue-800 text-white text-center py-2.5 uppercase tracking-wider border-b border-blue-900">
              <div class="font-extrabold text-sm md:text-base">${dia}</div>
              ${fechaEncabezado ? `<div class="text-[11px] text-blue-200 font-normal mt-0.5">${fechaEncabezado}</div>` : ''}
            </div>
            <div class="p-2 space-y-2 min-h-[280px]">${tarjetasHTML}</div>
          </div>
        `;

        contenedor.appendChild(col);
      });
    }

    function guardarPunto(e) {
      e.preventDefault();
      const editId = document.getElementById('editId').value;
      const datos = {
        dia: document.getElementById('dia').value,
        fecha: document.getElementById('fecha').value,
        jornada: document.getElementById('jornada').value,
        hora: document.getElementById('hora').value,
        lugar: document.getElementById('lugar').value,
        encargado: document.getElementById('encargado').value,
        actividad: document.getElementById('actividad').value
      };

      if (editId) {
        programacion = programacion.map(p => p.id == editId ? { ...datos, id: Number(editId) } : p);
      } else {
        programacion.push({ ...datos, id: Date.now() });
      }

      localStorage.setItem('agendaPuntos', JSON.stringify(programacion));
      cancelarEdicion();
      renderizarTabla();
    }

    function prepararEdicion(id) {
      const item = programacion.find(p => p.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('dia').value = item.dia;
      document.getElementById('fecha').value = item.fecha || '';
      document.getElementById('jornada').value = item.jornada || 'Mañana';
      document.getElementById('hora').value = item.hora;
      document.getElementById('lugar').value = item.lugar;
      document.getElementById('encargado').value = item.encargado;
      document.getElementById('actividad').value = item.actividad;

      document.getElementById('tituloForm').innerText = 'Editar Registro Seleccionado';
      document.getElementById('btnGuardar').innerText = '✓ Guardar Cambios';
      document.getElementById('btnCancelarEdit').classList.remove('hidden');
    }

    function cancelarEdicion() {
      document.getElementById('editId').value = '';
      document.getElementById('formPunto').reset();
      document.getElementById('tituloForm').innerText = 'Asignar Punto de Encuentro';
      document.getElementById('btnGuardar').innerText = '+ Asignar Punto';
      document.getElementById('btnCancelarEdit').classList.add('hidden');
    }

    function eliminarPunto(id) {
      programacion = programacion.filter(p => p.id !== id);
      localStorage.setItem('agendaPuntos', JSON.stringify(programacion));
      renderizarTabla();
    }

    function exportarJPG() {
      const contenedor = document.getElementById('tablaExportable');
      contenedor.classList.add('exporting');

      html2canvas(contenedor, { scale: 2 }).then(canvas => {
        const enlace = document.createElement('a');
        enlace.download = `Programa_del_servicio_del_campo.jpg`;
        enlace.href = canvas.toDataURL('image/jpeg', 0.95);
        enlace.click();
        contenedor.classList.remove('exporting');
      });
    }

    cargarDesplegables();
    renderizarTabla();
  </script>
</body>
</html>
